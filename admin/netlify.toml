# Netlify settings for the STAFF site: pogiako.atyourservice.com
# Create a second Netlify site from this same repo with
#   Base directory: admin
# and add the custom domain pogiako.atyourservice.com to it.

[build]
  command = "cd .. && npm ci && npm run build:admin"
  publish = "../dist-admin"

[build.environment]
  NODE_VERSION = "22"

# Send /api calls to the Express backend, so the login cookie stays on pogiako.
# TODO: replace API_HOST with where the Express server is deployed
# (e.g. at-your-service-api.onrender.com).
[[redirects]]
  from = "/api/*"
  to = "https://API_HOST/api/:splat"
  status = 200
  force = true

# Single-page app: every other path loads index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify settings for the public website (read automatically when the site deploys)
# The website lives in landingpage/. "command" runs inside that folder and
# "publish" is relative to it (so the site is built into landingpage/dist).
[build]
  base = "landingpage"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-term caching for files whose names change on every build
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
